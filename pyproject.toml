[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-automation-simulator"
# The version has exactly one home: `__version__` in `src/las/__init__.py`.
# It used to be written here as well, and two hand-maintained literals can
# drift silently. Setuptools resolves the attribute below statically — it
# parses the module rather than importing it, so this needs no installed
# distribution and adds no build-time import of the package.
dynamic = ["version"]
description = "Deterministic workflow automation against a simulated slow, stateful, faulty legacy system: configurable validation, entity matching, reconciliation and exception reporting over synthetic data, with typed failures and optional allowlist-sanitised audit-trail support for library callers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmet Utku Bayri" }]
keywords = [
    "automation",
    "legacy-systems",
    "data-validation",
    "reconciliation",
    "entity-matching",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business",
]
dependencies = [
    # openpyxl is pinned exactly: its version is embedded in generated
    # XLSX fixtures and affects byte-level reproducibility (see
    # docs/DEVELOPMENT_PLAN.md, "Determinism and reproducibility").
    "openpyxl==3.1.5",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    # `build`, `setuptools` and `wheel` are listed so the packaging tests can
    # build both archives locally with `--no-isolation`: the release policy in
    # MANIFEST.in is only worth asserting if the assertion runs offline, in the
    # same environment as the rest of the suite, without fetching a backend.
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "setuptools>=69",
    "wheel>=0.43",
]

[project.scripts]
las = "las.cli:main"

[tool.setuptools.dynamic]
version = { attr = "las.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.coverage.run]
source = ["las"]
