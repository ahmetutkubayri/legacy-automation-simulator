# Sample configuration for the Legacy Automation Simulator.
# Every value in this file is synthetic and invented for this project.

seed: 42
output_dir: output
log_level: INFO

simulator:
  fault_profile: mild
  fault_seed: 7
  visible_rows: 12
  buffer_rows: 3
  busy_delay_min_ms: 5
  busy_delay_max_ms: 50

# Every relative path in this file is resolved against the directory holding
# this file, never against the working directory or the repository root. These
# names therefore point at the committed generated fixtures beside it.
feeds:
  - name: feed_alpha
    path: feed_alpha.xlsx
    header_aliases:
      "Record Id": record_id
      "External Reference": external_ref
      "Quantity": amount
      "Quantity Unit": unit
      "Reporting Period": period
  - name: feed_beta
    path: feed_beta.csv
    header_aliases:
      "REC_ID": record_id
      "EXT_REF": external_ref
      "AMT": amount
      "UOM": unit
      "PRD": period

# Identifier schemes used by the generated fixtures:
#   OPR-########  record_id      operational record IDs (feeds)
#   EXT-#####     external_ref   identifiers supplied by external feeds,
#                                mapped to accounts via account_links.csv
#   ACC-######    account_ref    account master-data IDs (accounts.csv)
validation:
  required_fields: [record_id, external_ref, amount, period]
  record_id_pattern: "^OPR-\\d{8}$"
  external_ref_pattern: "^EXT-\\d{5}$"
  amount_min: 0.0
  amount_max: 1000000.0
  duplicate_key_fields: [record_id]

match:
  fuzzy_threshold: 0.87
  review_threshold: 0.70

report:
  formats: [xlsx, json, html]
  recipients: [ops-team@example.com]
  variance_bands: [0.0, 1.0, 5.0]
  streaming_row_threshold: 50000
